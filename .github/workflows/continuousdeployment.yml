name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Deploy realizado com sucesso!"